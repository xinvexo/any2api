name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the v prefix (for example, 0.1.1)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Resolve release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release version '$INPUT_VERSION' must be a stable SemVer without the v prefix" >&2
            exit 1
          fi
          release_tag="v$INPUT_VERSION"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "release tag '$release_tag' already exists" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ANY2API_BUILD_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      - run: cargo build --locked --release -p any2api --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          set -euo pipefail
          asset="any2api-${RELEASE_TAG}-linux-amd64.tar.gz"
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf "dist/$asset" any2api
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
