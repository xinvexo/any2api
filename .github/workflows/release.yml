name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Resolve version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "any2api") | .version')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"

      - run: cargo build --locked --release -p any2api --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          asset="any2api-${RELEASE_TAG}-linux-amd64.tar.gz"
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf "dist/$asset" any2api
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
